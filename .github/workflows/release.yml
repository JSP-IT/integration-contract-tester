name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check tag matches project version
        shell: bash
        run: |
          version=$(dotnet msbuild src/IntegrationContractTester -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $version."
            exit 1
          fi
          notes=".github/release-notes-$GITHUB_REF_NAME.md"
          if [ ! -f "$notes" ]; then
            echo "Release notes file $notes is missing."
            exit 1
          fi

      - run: dotnet test IntegrationContractTester.sln --configuration Release
      - run: dotnet pack src/IntegrationContractTester --configuration Release --output artifacts

      - name: Smoke-test packed tool
        shell: bash
        run: |
          dotnet tool install --tool-path artifacts/tool --add-source artifacts JspIt.IntegrationContractTester
          test "$(artifacts/tool/ict --version)" = "${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg \
            --title "Integration Contract Tester $GITHUB_REF_NAME" \
            --notes-file ".github/release-notes-$GITHUB_REF_NAME.md" \
            --verify-tag
